<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f4ed">
    <title>Hello, world! | Pace</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        color: #20382f;
        background: #f7f4ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background-image: radial-gradient(#d9ded0 0.7px, transparent 0.7px);
        background-size: 18px 18px;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid #e5e3d9;
        border-radius: 12px;
        background: #fffefa;
        box-shadow: 0 20px 60px #294b3512;
        text-align: center;
      }

      .mark {
        display: grid;
        width: 44px;
        aspect-ratio: 1;
        margin: 0 auto 32px;
        place-items: center;
        border-radius: 14px;
        background: #286451;
        color: white;
        font-size: 24px;
        font-weight: 700;
      }

      p {
        margin: 0;
        color: #68776e;
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(48px, 10vw, 76px);
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .message {
        max-width: 360px;
        margin: 20px auto 0;
        color: #68776e;
        font-size: 16px;
        letter-spacing: normal;
        line-height: 1.6;
        text-transform: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">p</div>
      <p>A little demo from Pace</p>
      <h1>Hello, world!</h1>
      <p class="message">A simple place to start. Make a change, commit it, and see it come to life. This is my second message.</p>
    </main>
  </body>
</html>
